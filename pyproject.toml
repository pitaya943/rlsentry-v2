[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rlsentry"
version = "0.1.0"
description = "Attack a disposable copy of a Supabase database as the anonymous visitor and report what RLS lets through."
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
test = ["pytest", "jsonschema"]

[project.scripts]
rlsentry = "rlsentry.cli:main"

[tool.setuptools]
packages = ["rlsentry"]

[tool.setuptools.package-data]
rlsentry = ["lab/*.sql", "lab/expected.json", "report.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
